name: Сборка Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Настройка сборки
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Сборка Release
        run: cmake --build build --config Release --parallel
      - name: Подготовка EXE
        run: cmake --install build --config Release --prefix artifacts
      - name: Сохранение EXE
        uses: actions/upload-artifact@v4
        with:
          name: AntivirusTray-windows-x64
          path: artifacts/AntivirusTray.exe
          if-no-files-found: error
          retention-days: 14
